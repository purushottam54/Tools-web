<!DOCTYPE html>
<html>
<head>
  <title>Slide and Open Animation with Mountain Background</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .slide-container {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      position: relative;
      transition: top 0.5s ease;
      background: linear-gradient(to bottom, #80d0c7, #0092ac);
    }

    .slide-content {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #fff;
      position: relative;
      z-index: 1;
    }

    .mountain {
      width: 100%;
      height: 200%;
      position: absolute;
      top: -100%;
      left: 0;
      background-image: url('mountain.png'); /* Replace with your own mountain image */
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      animation: mountain-animation 20s infinite linear;
      transform: translate3d(0, 0, 0);
      z-index: 0;
    }

    @keyframes mountain-animation {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(-50%);
      }
    }

    .website-container {
      width: 100%;
      height: 100vh;
      position: absolute;
      top: 100vh;
      transition: top 0.5s ease;
    }

    .website-content {
      width: 100%;
      height: 100%;
      background-color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #333;
      animation: fade-in 1s;
    }

    @keyframes fade-in {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="slide-content">
      <a href="#" onclick="slideAndOpenWebsite()">Tap on Shelter and Scroll Up</a>
    </div>
    <div class="mountain"></div>
  </div>

  <div class="website-container">
    <div class="website-content">
      <h1>Welcome to My Website!</h1>
      <!-- Add your website content here -->
    </div>
  </div>

  <script>
    function slideAndOpenWebsite() {
      const slideContainer = document.querySelector('.slide-container');
      const websiteContainer = document.querySelector('.website-container');
      slideContainer.style.top = '-100vh';
      websiteContainer.style.top = '0';
      document.body.style.overflow = 'auto';

      // Automatically scroll up after 5 seconds (5000 milliseconds)
      setTimeout(function() {
        scrollToTop();
      }, 5000);
    }

    function scrollToTop() {
      if (window.scrollY === 0) {
        return;
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
